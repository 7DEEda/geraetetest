<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geräte-Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Farben, Schrift, Karten und Hintergrund wie in der App, damit der Test sie so zeigt, wie das Gerät sie zeigen würde. */
:root{
  --paper:#F1F5EE; --card:#FFFFFF; --ink:#17302A; --muted:#445650; --line:#D3DECF;
  --contour:#CFDBC8; --flag:#EE5F1B; --flag-ink:#0F1B18; --water:#2F6E9E;
  --ok:#276B44; --err:#B3261E; --warn:#8A5A00; --ok-bg:#E3F1E7; --err-bg:#FBE9E7; --warn-bg:#FBF0D9; --info-bg:#E6EEF4; --dran-bg:#FDEEE4;
  --feld:#7D9189;
  --head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --park:#DFEAD6; --baum:#C3D5B8; --strasse:#CBD7C4; --strasse-haupt:#B5C5AE;
  --ol-braun:#E0CCB3; --ol-gelb:#F3EDD6; --ol-gruen:#DCEAD3; --ol-dicht:#C9DEBD; --ol-schwarz:#A3AFA9;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0F1B18; --card:#16261F; --ink:#E4EEE8; --muted:#9BB1A9; --line:#2A3F38;
  --contour:#1C312B; --flag:#FF7A3A; --flag-ink:#0F1B18; --feld:#5E786F; --water:#6FA8D6;
  --ok:#6CCB8E; --err:#FF8A80; --warn:#E8B75A; --ok-bg:#16332A; --err-bg:#3A1F1C; --warn-bg:#33290F; --info-bg:#172A36; --dran-bg:#2E2119;
  --park:#142A20; --baum:#1D3A2B; --strasse:#1F352E; --strasse-haupt:#29443A;
  --ol-braun:#332A21; --ol-gelb:#1E2419; --ol-gruen:#142A1E; --ol-dicht:#1A3524; --ol-schwarz:#3B4C45}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);min-height:100vh}
.topo{position:fixed;top:-18px;left:-18px;z-index:0;pointer-events:none;width:calc(100% + 36px);height:calc(100vh + 36px);height:calc(100lvh + 36px);overflow:hidden;
  transform:translate(var(--nx,0px),var(--ny,0px));will-change:transform}
/* Die Karte steht beim Scrollen still (Entscheidung 02.10.2026), sie bewegt sich nur mit der Neigung */
.topo svg{display:block;width:100%;height:calc(100lvh + 36px)}
@media (prefers-reduced-motion:reduce){.topo{transform:none}}
.topo *{vector-effect:non-scaling-stroke}
.topo text{vector-effect:none}
@media (min-width:700px){.topo text{display:none}}   /* Beschriftungen wären am Laptop riesig */
/* klassisch und A: Wanderkarte */
.topo .c,.topo .c5{fill:none;stroke:var(--contour);stroke-width:1}
.topo .c5{stroke-width:1.9}
.topo .w{fill:none;stroke:var(--water);stroke-width:2.4;opacity:.38;stroke-linecap:round}
.topo .wl{fill:none;stroke:var(--water);stroke-width:1.1;opacity:.22}
.topo .t{fill:none;stroke:var(--flag);stroke-width:1.7;stroke-dasharray:8 6;stroke-linecap:round;opacity:.4}
.topo .t2{stroke-dasharray:3 5;opacity:.3}
.topo .p{fill:none;stroke:var(--contour);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.topo .pf{fill:var(--contour);stroke:none}
.topo .wald{fill:url(#a-wald)}
.topo .baum{fill:var(--baum)}
.topo .gitter{fill:none;stroke:var(--contour);stroke-width:.6}
.topo .gl,.topo .hz{font:600 8px var(--body);fill:var(--muted);opacity:.5}
.topo .hz{font-weight:500;opacity:.6}
.topo .nord path{fill:var(--muted);opacity:.45}
.topo .nord text{font:700 10px var(--head);fill:var(--muted);opacity:.55;text-anchor:middle}
.topo .mass path{fill:none;stroke:var(--muted);opacity:.45}
.topo .mass text{font:500 8px var(--body);fill:var(--muted);opacity:.55}
/* B: Stadtplan aus OpenStreetMap */
.topo .park{fill:var(--park)}
.topo .wasser{fill:var(--water);fill-opacity:.16;stroke:var(--water);stroke-opacity:.35;stroke-width:.7}
.topo .bach{fill:none;stroke:var(--water);stroke-width:.8;opacity:.35}
.topo .bahn-gl{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;opacity:.3}
.topo [class^="st"]{fill:none;stroke:var(--strasse);stroke-linecap:round;stroke-linejoin:round}
.topo .st-fuss{stroke-width:.6;stroke-dasharray:1.5 2}
.topo .st{stroke-width:1}
.topo .st-mittel{stroke-width:1.5}
.topo .st-haupt{stroke-width:2.1;stroke:var(--strasse-haupt)}
.topo .fl{font:italic 600 11px var(--head);letter-spacing:.3em;fill:var(--water);opacity:.55}
.topo .vl{font:600 8.5px var(--head);letter-spacing:.2em;text-transform:uppercase;fill:var(--muted);opacity:.55;text-anchor:middle}
.topo .osm{font:500 6px var(--body);fill:var(--muted);opacity:.7;text-anchor:end}
/* C: Orientierungslauf-Karte */
.topo .ol-offen{fill:var(--ol-gelb)}
.topo .ol-gruen{fill:var(--ol-gruen)}
.topo .ol-gruen2{fill:url(#c-dicht)}
.topo .dicht{stroke:var(--ol-dicht);stroke-width:1.4}
.topo .ol-sumpf{fill:url(#c-sumpf)}
.topo .sumpf{stroke:var(--water);stroke-width:1;opacity:.45}
.topo .ol-c,.topo .ol-c5,.topo .ol-form{fill:none;stroke:var(--ol-braun);stroke-width:.9}
.topo .ol-c5{stroke-width:1.7}
.topo .ol-form{stroke-width:.7;stroke-dasharray:5 3}
.topo .ol-w{fill:none;stroke:var(--water);stroke-width:2.2;opacity:.45;stroke-linecap:round}
.topo .ol-wl{fill:none;stroke:var(--water);stroke-width:.9;opacity:.4}
.topo .ol-stein{stroke:var(--ol-schwarz);stroke-width:3.4;stroke-linecap:round}
.topo .ol-wand{fill:none;stroke:var(--ol-schwarz);stroke-width:1.1}
.topo .ol-weg,.topo .ol-pfad,.topo .ol-spur{fill:none;stroke:var(--ol-schwarz);stroke-width:1.3}
.topo .ol-pfad{stroke-width:1;stroke-dasharray:5 2.5}
.topo .ol-spur{stroke-width:.8;stroke-dasharray:2 2.5}
.topo .ol-nord{stroke:var(--water);stroke-width:.6;opacity:.3}
.topo .bahn{fill:none;stroke:var(--flag);stroke-width:1.6;opacity:.6}
.topo .bahn-n{font:700 12px var(--head);fill:var(--flag);opacity:.75}
main > :not(.panel){text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 12px var(--paper),0 0 18px var(--paper)}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:20px 16px 30px}
h1,h2{font-family:var(--head);margin:0;line-height:1.1}
h1{font-size:32px;font-weight:700}h2{font-size:22px;font-weight:700}
p{margin:.4em 0 0}
.muted{color:var(--muted)}.small{font-size:14px}
.flag{width:30px;height:30px;flex:none}
/* Das Zeichen im Kopf ist ein Kompass. Liefert das Gerät eine Richtung, zeigt die orange Spitze wirklich nach Norden. */
#nadel{transform-origin:12px 12px;transition:transform .16s linear}
@media (prefers-reduced-motion:reduce){#nadel{transition:none}}
/* Aufbau nach Material 3: Kopf mit Fortschritt, ein Schritt pro Bildschirm, die Aktion unten im Daumenbereich */
main{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:0}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:22px;flex:1}
.zahl{font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.fort{height:4px;border-radius:2px;background:var(--line);margin-top:12px;overflow:hidden}
.fort i{display:block;height:100%;width:0;background:var(--flag);transition:width .3s cubic-bezier(.32,.72,.4,1)}
.inhalt{flex:1;padding-top:28px;animation:ein .16s cubic-bezier(.32,.72,.4,1)}
@keyframes ein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bild{width:96px;height:96px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:4px 0 20px;text-shadow:none}
.bild svg{width:52px;height:52px}
.bild.fertig{background:var(--ok-bg);border-color:transparent}
/* Start und Ende: Zeichen mittig und größer, so erkennt man die beiden Bildschirme auf einen Blick */
.bild.mitte{width:120px;height:120px;border-radius:30px;margin:12px auto 24px}
.bild.mitte svg{width:66px;height:66px}
/* Startzeichen ist ein Knopf: ein Tipp vibriert (Android) oder gibt ein haptisches Klicken (iPhone) */
.bild.summ{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(.32,.72,.4,1)}
.bild.summ:active{transform:scale(.94)}
.bild.summ.wackelt svg{animation:wackel .3s cubic-bezier(.32,.72,.4,1)}
@keyframes wackel{0%,100%{transform:none}25%{transform:translateX(-3px) rotate(-4deg)}75%{transform:translateX(3px) rotate(4deg)}}
.inhalt h2{font-size:32px;margin-bottom:10px}
.inhalt p{margin:0 0 10px;font-size:19px}
.inhalt p.klein{font-size:15px;color:var(--muted)}
ol.teil{margin:4px 0 10px;padding-left:22px;font-size:19px}
ol.teil li{margin-bottom:6px}
.nb{white-space:nowrap}
/* Handy drehen: Kugel läuft mit der Himmelsrichtung um den Kreis, jeder überfahrene Strich wird orange */
#kreis{display:block;width:220px;height:220px;margin:0 auto 18px}
#kreis line{stroke:var(--line);stroke-width:3.2;stroke-linecap:round;transition:stroke .16s}
#kreis line.an{stroke:var(--flag)}
#kreis .mitte{fill:var(--card);stroke:var(--line);stroke-width:1}
#kreis #kugel{fill:var(--flag);stroke:var(--card);stroke-width:1.5}
#kreis text{font:700 15px var(--head);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
/* Einmessen: Handy fährt eine liegende Acht ab */
.acht{display:block;width:100%;max-width:260px;height:auto;margin:0 auto 18px}
.acht .bahn{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:6 6}
.acht .handy{fill:var(--card);stroke:var(--ink);stroke-width:2.5}
.acht .schirm{fill:var(--flag);opacity:.85}
/* Sperre vor dem Drehen: erst wenn das Handy flach liegt, geht es los. Fenster wie die Dialoge, ohne Unschärfe dahinter. */
#flach{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--paper) 84%,transparent);
  transition:opacity .16s cubic-bezier(.32,.72,.4,1)}
#flach.weg{opacity:0;pointer-events:none}
#flach .fenster{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:340px;text-align:center;text-shadow:none;
  box-shadow:0 12px 32px rgba(17,17,17,.14),0 2px 6px rgba(17,17,17,.06);animation:auf .16s cubic-bezier(.32,.72,.4,1)}
@keyframes auf{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
#flach svg{width:180px;height:110px;display:block;margin:0 auto 12px}
#flach h3{font:700 22px var(--head);margin:0 0 6px}
#flach p{font-size:16px;margin:0;color:var(--muted)}
#flachgrad{font:700 19px var(--head);color:var(--ink);margin-top:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.liegt{transform-origin:46px 82px;animation:hinlegen 2.6s cubic-bezier(.32,.72,.4,1) infinite}
@keyframes hinlegen{0%,12%{transform:rotate(-58deg)}50%,86%{transform:rotate(0deg)}100%{transform:rotate(-58deg)}}
@media (prefers-reduced-motion:reduce){.liegt{animation:none}#flach .fenster{animation:none}}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.aktion{position:sticky;bottom:0;z-index:2;display:flex;flex-direction:column;gap:8px;padding:16px 0 calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,transparent,var(--paper) 24px)}
.aktion:empty{display:none}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 16px;font:700 19px var(--head);cursor:pointer;background:var(--flag);color:var(--flag-ink);min-height:52px;text-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--feld)}
.btn:active{filter:brightness(.93)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.txt{min-height:48px;border:0;background:none;font:600 17px var(--body);color:var(--muted);cursor:pointer;text-shadow:none}
.paar{display:flex;gap:8px}.paar .btn{flex:1}
.frage{text-align:center;font:700 19px var(--head);margin:0}
/* Liste des automatischen Teils und das Ergebnis am Ende */
.liste{list-style:none;padding:0;margin:8px 0 0}
.liste li{border-bottom:1px solid var(--line)}
.zeile{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;background:none;border:0;padding:4px 0;font:inherit;color:inherit;text-align:left}
button.zeile{cursor:pointer}
.zeile .t{flex:1;min-width:0}
.zeile .w{font-size:15px;color:var(--muted);text-align:right;max-width:50%;overflow-wrap:anywhere}
.ic{width:22px;height:22px;flex:none;display:grid;place-items:center}
.dreh{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--flag);animation:dreh .8s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dreh{animation:none;border-color:var(--flag)}.inhalt{animation:none}.fort i,#kreis line{transition:none}}
.mehr{margin:0 0 10px 34px;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.mehr .grund{grid-column:1/-1;margin-bottom:4px}
.mehr dt{color:var(--muted)}.mehr dd{margin:0;text-align:right;overflow-wrap:anywhere}
/* Schritt läuft: Stand in einer Karte, damit man ihn beim Gehen liest */
.lauf{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:17px;text-shadow:none}
.karte{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;text-shadow:none}
.karte.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.karte.err{background:var(--err-bg);border-color:transparent;color:var(--err)}
.karte h3{font:700 19px var(--head);margin:0 0 4px}
.karte p{font-size:15px!important;margin:0!important}
.kennung{font:700 17px var(--head);letter-spacing:.04em;white-space:nowrap}
details{margin-top:12px}
summary{min-height:48px;display:flex;align-items:center;font:600 17px var(--body);color:var(--muted);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid;border-bottom:2px solid;transform:rotate(45deg);margin:-4px 0 0 10px}
details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
#feld img{max-width:160px;border-radius:8px;margin-top:4px}
/* Speicherstand für Screenreader und Prüfstand; zu sehen ist er am Ende */
/* Tafel auf der Startseite: Piktogramme wie am Eingang eines Parks, ein Wort je Feld */
.tafel{border-radius:10px;padding:14px 10px 12px;margin:14px 0 4px;background:var(--ink);color:var(--paper);text-shadow:none}
.tafel ul{list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;gap:4px}
.tafel li{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.pikto{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;background:var(--paper);color:var(--ink)}
.pikto svg{width:30px;height:30px}
.pikto .ak{color:var(--flag)}
.tafel b{font:700 14px var(--head);white-space:nowrap}
/* Freigaben: nachgebaute Systemfragen, orange umrandet ist, was man tippen soll */
.schritt{display:flex;gap:10px;margin-top:12px;align-items:flex-start}
.nr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 15px var(--head);display:grid;place-items:center;margin-top:2px;text-shadow:none}
.schritt .was{flex:1;min-width:0}
.schritt .was > b{font:700 17px var(--head);display:block;margin-bottom:6px}
.and{background:#2A2D3E;border-radius:22px;padding:12px;font-family:Roboto,system-ui,sans-serif;color:#E6E6F0;box-shadow:0 2px 6px rgba(0,0,0,.25);text-shadow:none}
.and .t{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.25;margin-bottom:8px}
.and .t i{flex:none;width:24px;height:24px;border-radius:50%;background:#3A66E0;display:grid;place-items:center}
.and .t i::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.and .karte2{display:flex;align-items:center;justify-content:space-between;background:#1E2030;border-radius:12px;padding:7px 10px;margin-bottom:6px;font-size:12px}
.and .karte2 small{display:block;color:#A9ABBD;font-size:11px}
.and .karte2 .rund{width:16px;height:16px;border-radius:50%;border:2px solid #A9ABBD}
.and .karte2 .rund.an{background:#E6E6F0;border-color:#E6E6F0}
.and .kn{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.and .kn span{background:#3A55C8;color:#fff;border-radius:12px;padding:7px;text-align:center;font-size:12px;font-weight:500}
.ios{background:#F2F2F7;border-radius:14px;text-align:center;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:#000;box-shadow:0 2px 8px rgba(0,0,0,.2);overflow:hidden;text-shadow:none}
.ios .t{font-size:13px;font-weight:600;line-height:1.3;padding:12px 14px 8px}
.ios .zeile{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 14px;border-top:.5px solid #C6C6C8;text-align:left}
.ios .schalter{width:34px;height:20px;border-radius:10px;background:#34C759;position:relative}
.ios .schalter::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.ios .kn{display:flex;border-top:.5px solid #C6C6C8;font-size:14px;color:#007AFF}
.ios .kn span{flex:1;padding:9px 4px}
.ios .kn span + span{border-left:.5px solid #C6C6C8;font-weight:600}
.tipp{outline:2.5px solid var(--flag);outline-offset:-2px}
.hinw{font-size:13px;color:var(--muted);margin-top:5px}
#speicher{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SUITE = window.GT_TESTS;
const KONF = window.GT_CONFIG || window.SJ_CONFIG || {};
const cfg = { url: KONF.url || "", key: KONF.key || "" };
// Privater Modus: schon der Zugriff auf localStorage kann werfen. Dann merkt sich die Seite nichts.
const LS = (() => { try { localStorage.setItem("gt._", "1"); localStorage.removeItem("gt._"); return localStorage; } catch { return { getItem: () => null, setItem() {}, removeItem() {} }; } })();

async function rpc(fn, args) {
  if (!cfg.url || !cfg.key) throw new Error("config.js fehlt");
  let res;
  try {
    res = await fetch(cfg.url.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: cfg.key, Authorization: "Bearer " + cfg.key },
      body: JSON.stringify(args || {})
    });
  } catch { throw new Error("keine Verbindung"); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error((data && data.message) || "HTTP " + res.status);
  return data;
}

/* ---------- Ausrichtung: ein Zuhörer für Kompass, Neigung und Hintergrund ---------- */
const sensor = {
  dreh: 0, nTick: false, n: 0, richtung: null, quelle: null, genau: null, beta: null, gamma: null, faecher: new Set(), an: false, bezug: null, tick: false, ziel: { x: 0, y: 0 },
  // Gyroskop: je Achse (alpha, beta, gamma) die aufsummierte Drehung und der Weg (Betrag) in Grad.
  // Welche Achse die Hochachse ist, legt Chrome auf Android anders ab als der Standard: gyroDreh() nimmt die,
  // die sich seit Beginn der Aufzeichnung am meisten bewegt hat (liegt das Handy flach, eindeutig).
  gyroAchse: [0, 0, 0], gyroPfad: [0, 0, 0], gyroN: 0, gyroT: null,
  // Drehung um die Senkrechte: Drehrate auf "oben" projiziert (oben = Schwerkraft aus accelerationIncludingGravity),
  // gilt auch, wenn das Handy schräg gehalten wird. hochN zählt die Meldungen, in denen "oben" bekannt war.
  oben: null, gyroHoch: 0, hochN: 0,
  // neu = true hängt den Zuhörer frisch ein: nach der iOS-Freigabe, falls Safari den alten nicht bedient
  start(neu) {
    if (!window.DeviceOrientationEvent || (this.h && !neu)) return;
    if (this.h) { removeEventListener("deviceorientation", this.h); removeEventListener("deviceorientationabsolute", this.h); }
    this.an = true;
    this.h = e => this.bei(e);
    addEventListener("deviceorientation", this.h, { passive: true });
    if ("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute", this.h, { passive: true });
    if (window.DeviceMotionEvent) {
      if (this.hm) removeEventListener("devicemotion", this.hm);
      this.hm = e => this.bewegt(e);
      addEventListener("devicemotion", this.hm, { passive: true });
    }
  },
  // Drehung seit Beginn der Aufzeichnung (this.spur) um die Achse mit dem meisten Weg, im Uhrzeigersinn positiv wie die
  // Kompassrichtung. Drehraten zählen nach der rechten Hand gegen den Uhrzeigersinn positiv, darum das Minus.
  gyroDreh() {
    const sp = this.spur; if (!sp || this.gyroN <= sp.gyroN0) return null;
    // bevorzugt die Drehung um die Senkrechte; nur ohne Schwerkraftdaten die Achse mit dem meisten Weg
    if (this.hochN > sp.hochN0) { sp.achse = "senkrecht"; return -(this.gyroHoch - sp.hoch0); }
    let bi = 0, best = -1;
    for (let i = 0; i < 3; i++) { const d = this.gyroPfad[i] - sp.pfad0[i]; if (d > best) { best = d; bi = i; } }
    sp.achse = bi;
    return -(this.gyroAchse[bi] - sp.achse0[bi]);
  },
  // Gyroskop und Beschleunigung
  bewegt(e) {
    const t = performance.now(), r = e.rotationRate;
    if (r && typeof r.alpha === "number") {
      if (this.gyroT != null) {
        const dt = Math.min(0.1, (t - this.gyroT) / 1000);
        [r.alpha, r.beta, r.gamma].forEach((w, i) => { if (typeof w === "number") { this.gyroAchse[i] += w * dt; this.gyroPfad[i] += Math.abs(w) * dt; } });
        // Achsen wie in den Läufen vom 02.10. gemessen, auf Android-Chrome und iOS-Safari gleich:
        // alpha um x, beta um y, gamma um z (z zeigt aus dem Bildschirm)
        if (this.oben && typeof r.beta === "number" && typeof r.gamma === "number") {
          const v = r.alpha * this.oben[0] + r.beta * this.oben[1] + r.gamma * this.oben[2];
          this.gyroHoch += v * dt; this.hochN++;
          this.drehRate = Math.abs(v); this.drehRateT = t;   // °/s um die Senkrechte, für "dreht sich gerade" 
        }
      }
      this.gyroT = t; this.gyroN++;
    }
    const g = e.accelerationIncludingGravity;
    if (g && typeof g.z === "number") {
      const b = Math.hypot(g.x || 0, g.y || 0, g.z);
      if (b > 1) {
        // "oben" so wenden, dass es aus dem Bildschirm zeigt (z > 0): iOS meldet die Schwerkraft mit umgekehrtem Vorzeichen
        let o = [(g.x || 0) / b, (g.y || 0) / b, g.z / b];
        if (o[2] < 0) o = o.map(v => -v);
        this.obenRoh = o;
        // nur leicht glätten: kommen beim Stillliegen keine Meldungen mehr, darf "oben" nicht auf einem Zwischenwert hängen
        this.oben = this.oben ? this.oben.map((v, i) => v + (o[i] - v) * 0.6) : o;
      }
    }
    if (this.spur && g && typeof g.z === "number") {
      const b = Math.hypot(g.x || 0, g.y || 0, g.z);
      if (b > 1) {
        const neig = Math.acos(Math.min(1, Math.abs(g.z) / b)) * 180 / Math.PI;   // 0° = liegt flach
        this.spur.neigMax = Math.max(this.spur.neigMax, neig); this.spur.neigSum += neig; this.spur.neigN++;
      }
    }
  },
  bei(e) {
    this.n++;
    // Richtung bestimmen wie die App: iOS liefert webkitCompassHeading, Android alpha im absoluten Ereignis
    let neu = null;
    if (typeof e.webkitCompassHeading === "number") {
      neu = this.richtung = e.webkitCompassHeading; this.quelle = "webkitCompassHeading";
      if (typeof e.webkitCompassAccuracy === "number") this.genau = e.webkitCompassAccuracy;
    } else if (e.absolute && e.alpha != null) { neu = this.richtung = (360 - e.alpha) % 360; this.quelle = "alpha (absolut)"; }
    else if (e.alpha != null && !this.quelle) this.quelle = "relativ";
    // Aufzeichnung für "Handy einmal drehen": jede Meldung mit Zeit, dazu Sprünge zwischen zwei Meldungen
    if (neu != null && this.spur) {
      const t = Math.round(performance.now() - this.spur.t0);
      if (this.spur.letzte != null) {
        const d = Math.abs(((neu - this.spur.letzte) % 360 + 540) % 360 - 180);
        if (d > this.spur.max) { this.spur.max = d; this.spur.maxBei = t; }
        if (d > 30) this.spur.ueber30++;
        // Wandern: der Kompass ändert sich, obwohl das Gyroskop keine Drehung misst (nur mit Gyroskop-Daten)
        if (this.drehRateT != null && !(performance.now() - this.drehRateT < 300 && this.drehRate > 8)) this.spur.wandert = (this.spur.wandert || 0) + d;
      }
      this.spur.letzte = neu;
      const y = this.gyroDreh();
      if (this.spur.w.length < 3000) this.spur.w.push([t, Math.round(neu * 10) / 10, y == null ? null : Math.round(y), this.genau == null ? null : Math.round(this.genau)]);
    }
    if (this.richtung != null && this.quelle !== "relativ") {
      // Ein Strich zählt nur, wenn sich das Handy laut Gyroskop gerade dreht (über 8°/s): sonst färbt ein Kompass,
      // der im Stillliegen wandert, den Kreis von allein (02.10., Xiaomi 22021211RG: 80° ohne Bewegung)
      const dreht = this.drehRateT == null || (performance.now() - this.drehRateT < 300 && this.drehRate > 8);
      if (dreht) this.faecher.add(Math.floor(this.richtung / 10) % 36);
      // Nadel im Kopf nachführen, auf dem kürzesten Weg (von 359° auf 1° sind es 2°, nicht 358°)
      this.dreh += ((-this.richtung - this.dreh) % 360 + 540) % 360 - 180;
      if (!this.nTick) { this.nTick = true; requestAnimationFrame(() => { this.nTick = false; $("#nadel").style.transform = `rotate(${this.dreh.toFixed(1)}deg)`; kreisMalen(); }); }
    }
    if (e.beta == null || e.gamma == null) return;
    // Einmessen: Zeit zählen, in der das Handy schneller als 80°/s geschwenkt wird (wie beim Einmessen in der App)
    if (this.kal) {
      const t = e.timeStamp || performance.now(), k = this.kal;
      if (k.letzt) {
        const dt = t - k.letzt.t, w = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);
        if (dt > 0 && dt < 200 && (w(e.beta, k.letzt.b) + w(e.gamma, k.letzt.c)) / dt * 1000 > 80) k.bewegt += dt;
      }
      k.letzt = { t, b: e.beta, c: e.gamma };
    }
    this.beta = e.beta; this.gamma = e.gamma;
    // Neigungs-Parallax wie in der App
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    // Fast senkrecht kippt gamma schlagartig um 180° (Eigenheit der Winkel bei beta um 90°): dann stillhalten statt springen
    if (Math.abs(e.beta) > 75) return;

    const quer = Math.abs(screen.orientation?.angle ?? window.orientation ?? 0) === 90;
    const x = quer ? e.beta : e.gamma, y = quer ? -e.gamma : e.beta;
    if (!this.bezug) this.bezug = { x, y };
    this.bezug.x += (x - this.bezug.x) * 0.02; this.bezug.y += (y - this.bezug.y) * 0.02;
    const k = d => Math.max(-18, Math.min(18, (d / 25) * 18));
    this.ziel = { x: k(x - this.bezug.x), y: k(y - this.bezug.y) };
    if (!this.tick) { this.tick = true; requestAnimationFrame(() => this.gleiten()); }
  },
  // Die Karte gleitet zur neuen Lage, statt jedem Messwert sofort zu folgen (kein Zucken bei verrauschten Sensoren)
  ist: { x: 0, y: 0 },
  gleiten() {
    this.tick = false;
    const t = $("#topo"), i = this.ist, z = this.ziel;
    i.x += (z.x - i.x) * 0.18; i.y += (z.y - i.y) * 0.18;
    t.style.setProperty("--nx", i.x.toFixed(1) + "px"); t.style.setProperty("--ny", i.y.toFixed(1) + "px");
    if (Math.abs(z.x - i.x) > 0.1 || Math.abs(z.y - i.y) > 0.1) { this.tick = true; requestAnimationFrame(() => this.gleiten()); }
  }
};
const brauchtNachfrage = window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function";
// Immer gleich zuhören: Android liefert ohne Nachfrage, iOS erst nach dem Tipp. requestPermission gibt es
// inzwischen auch in Chrome, am Vorhandensein lässt sich iOS also nicht mehr erkennen.
sensor.start();

/* Hintergrund: immer die klassische Karte aus dem Markup. Die Varianten A bis C zeigt die Seite
   bewusst nicht, sie tragen Ortsnamen und Posten, der Test soll neutral bleiben. */

}

// Android: navigator.vibrate. iPhone kennt das nicht; dort gibt das Umlegen eines
// Schalters (<input type="checkbox" switch>, ab iOS 18) ein kurzes haptisches Klicken.
// Beides nur aus dem Fingertipp heraus.
function summen(b) {
  b.classList.remove("wackelt"); void b.offsetWidth; b.classList.add("wackelt");
  if (typeof navigator.vibrate === "function") { try { navigator.vibrate([60, 40, 60]); } catch (e) {} return; }
  const l = document.createElement("label"), i = document.createElement("input");
  i.type = "checkbox"; i.setAttribute("switch", ""); l.appendChild(i);
  l.style.display = "none"; document.head.appendChild(l);
  l.click(); l.remove();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-was]"); if (!b) return;
  const was = b.dataset.was, z = HAND[S.i];
  if (was === "summ") return summen(b);
  if (was === "weiter") { S.seite = "freigaben"; return zeichne(); }
  if (was === "start") return starten();
  if (was === "los") return fuehre(z);              // ohne await davor: Kamera und Mitteilungen brauchen den Fingertipp
  if (was === "weg") return fertig(z, { art: "skip", wert: "übersprungen", mess: {} });
  if (was === "ab") { z.nr++; return fertig(z, { art: "skip", wert: "abgebrochen", mess: {} }); }
  if (was === "ja") return fertig(z, z.vorl);
  if (was === "nein") return fertig(z, { ...z.vorl, art: "err", wert: "nicht wahrgenommen" });
  if (was === "auf") { const y = Z[+b.dataset.k]; y.auf = !y.auf; b.closest("li").outerHTML = ergZeile(y, +b.dataset.k); return; }
  if (was === "senden") { kette = kette.then(allesSenden); return; }
  if (was === "kopie") return kopieren(b, "Bericht kopieren");
  if (was === "neu") location.reload();
});

function fuehre(z) {
  z.st = "laeuft"; z.status = ""; z.feld.innerHTML = "";
  if (z.t.id === "kompass-drehen") S.kreisNull = null;   // Bezugsrichtung für die mitdrehende Zahl neu nehmen
  const nr = ++z.nr;   // ein abgebrochener Lauf darf später kein Ergebnis mehr abliefern
  zeichne();
  const t0 = performance.now(), grenze = (z.t.grenze || (z.t.hand ? 100 : 30)) * 1000;
  const ctx = { ...basis, feld: z.feld, status: s => {
    if (z.st !== "laeuft" || z.nr !== nr) return;
    z.status = s;
    if (!z.selbst && HAND[S.i] === z) { const el = $("#live"); if (el) el.textContent = s; }
  } };
  let versprechen;
  try { versprechen = Promise.resolve(z.t.lauf(ctx)); } catch (e) { versprechen = Promise.reject(e); }
  return Promise.race([versprechen,
    new Promise(r => setTimeout(() => r({ art: "err", wert: "keine Antwort", mess: { "Zeitgrenze": grenze / 1000 + " s" } }), grenze))])
    .catch(e => ({ art: "err", wert: "Fehler", mess: { "Fehler im Test": (e && e.message) || String(e) } }))
    .then(erg => {
      if (z.st !== "laeuft" || z.nr !== nr) return;
      erg.dauerMs = Math.round(performance.now() - t0);
      if (z.t.frage && erg.art === "ok") { z.vorl = erg; z.st = "frage"; zeichne(); }
      else fertig(z, erg);
    });
}

function fertig(z, erg) {
  z.erg = erg; z.st = "fertig";
  if (z.selbst) { if (S.seite === "auto") zeichne(); return; }
  if (S.i < HAND.length - 1) S.i++; else S.seite = "ende";
  zeichne(); speichern();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function bilanz() {
  const n = a => Z.filter(z => z.erg && z.erg.art === a).length;
  return { ok: n("ok"), warn: n("warn"), err: n("err"), skip: n("skip") };
}

/* ---------- Start: alles, was einen Fingertipp braucht, steht vor dem ersten await ---------- */
function starten() {
  if (S.seite !== "freigaben") return;
  // Wach halten mit Tipp: die Anfrage noch im Tipp stellen, der Schritt "wachhalten-tipp" wertet sie aus
  if (navigator.wakeLock) {
    basis.wach.tippAktiv = navigator.userActivation ? (navigator.userActivation.isActive ? "ja" : "nein") : "keine Angabe";
    basis.wach.tippAnfrage = navigator.wakeLock.request("screen");
    basis.wach.tippAnfrage.catch(() => {});
  }
  // Die iOS-Nachfrage nach Bewegung braucht den Tipp ebenfalls
  const bewegung = brauchtNachfrage ? DeviceOrientationEvent.requestPermission() : null;
  S.seite = "auto"; zeichne();
  automatisch(bewegung);
}
async function automatisch(bewegung) {
  if (bewegung) { try { basis.bewegung = await bewegung; } catch (e) { basis.bewegung = "Fehler: " + e.message; } }
  else basis.bewegung = window.DeviceOrientationEvent ? "nicht nötig" : "nicht vorhanden";
  sensor.start(true);
  lauf.begonnen = new Date().toISOString();
  for (const z of SELBST) await fuehre(z);
  lauf.autoFertig = true;
  S.seite = HAND.length ? "hand" : "ende"; S.i = 0;
  zeichne();
  await speichern();
}

/* ---------- Speichern ---------- */
function payload() {
  const tests = {};
  for (const z of Z) if (z.erg) tests[z.t.id] = { art: z.erg.art, wert: z.erg.wert, mess: z.erg.mess || {}, dauerMs: z.erg.dauerMs ?? null, ...(z.erg.roh ? { roh: z.erg.roh } : {}) };
  // Der Name des Laufs entsteht aus dem, was das Gerät über sich meldet
  const u = (tests.umgebung || {}).mess || {};
  const label = [u["Geräteart"], u["Modell"] === "keine Angabe" ? null : u["Modell"], u["Betriebssystem"], u["Browser"], `${screen.width} x ${screen.height}`].filter(Boolean).join(", ").slice(0, 80);
  const p = { suite: SUITE.version, label, begonnen: lauf.begonnen, beendet: new Date().toISOString(),
    ua: navigator.userAgent, seite: location.href.split("?")[0], bilanz: bilanz(), tests };
  // Der Server nimmt höchstens 64 KB je Lauf. Wird es eng, fallen die Rohdaten weg, nie der Lauf selbst.
  if (new Blob([JSON.stringify(p)]).size > 60000) for (const t of Object.values(tests)) if (t.roh) { delete t.roh; t.mess["Rohdaten"] = "weggelassen, Lauf zu groß"; }
  return p;
}
// Jeder Lauf liegt unter eigenem Namen auf dem Gerät, bis der Server ihn bestätigt hat. So überschreibt
// ein neuer Lauf keinen alten, der im Funkloch hängen geblieben ist.
const OFFEN = "gt.offen.", OFFEN_ALT = "sj.gt.offen.";
function offene() {
  const aus = [];
  try {
    for (const k of Object.keys(localStorage)) {
      const pr = k.startsWith(OFFEN) ? OFFEN : k.startsWith(OFFEN_ALT) ? OFFEN_ALT : null;
      if (!pr) continue;
      try { aus.push({ key: k.slice(pr.length), payload: JSON.parse(localStorage.getItem(k)), pr }); } catch { localStorage.removeItem(k); }
    }
    const alt = JSON.parse(localStorage.getItem("sj.gt.offen") || "null");   // Ablage der ersten Fassung
    if (alt && alt.key && alt.payload && !aus.some(o => o.key === alt.key)) aus.push(alt);
  } catch { /* privater Modus: nichts abgelegt */ }
  return aus;
}
// Stand des Speicherns: unsichtbar für Screenreader und Prüfstand in #speicher, zu sehen am Ende
function status(art, text, sp) {
  const el = $("#speicher"); el.className = art; el.textContent = text;
  S.sp = { art, ...sp };
  speicherZeigen();
}
function speicherZeigen() {
  if (S.seite !== "ende") return;
  const box = $("#ende-sp"), akt = $("#aktion"); if (!box) return;
  const sp = S.sp || { art: "info" };
  if (sp.art === "ok") {
    box.innerHTML = `<p>Das Ergebnis ist gespeichert als Lauf <span class="kennung">${lauf.key.slice(0, 4)}</span>. Die Seite kann jetzt zu.</p>`;
    akt.innerHTML = "";
  } else if (sp.art === "err") {
    box.innerHTML = `<div class="karte err"><h3>Noch nicht gespeichert</h3><p>${esc(sp.grund)}. Das Ergebnis bleibt auf dem Handy und geht beim nächsten Öffnen der Seite von selbst raus. Oder gleich erneut senden, sobald wieder Netz da ist.</p></div>`;
    akt.innerHTML = `<button class="btn" data-was="senden">Erneut senden</button><button class="txt" data-was="kopie">Bericht kopieren</button>`;
  } else {
    box.innerHTML = `<p>Das Ergebnis wird gespeichert …</p>`;
    akt.innerHTML = "";
  }
}
let kette = Promise.resolve();
function speichern() {
  LS.setItem(OFFEN + lauf.key, JSON.stringify(payload()));
  kette = kette.then(allesSenden);
  return kette;
}
// Schickt alles, was auf dem Gerät liegt: den laufenden Lauf und frühere, die hängen geblieben sind
async function allesSenden() {
  const liste = offene();
  // Gesperrter Speicher (privater Modus, Cookies blockiert): offene() findet nichts, der laufende Lauf geht
  // trotzdem raus (Bugjagd 03.10.2026, Fund 11). Sonst stand am Ende endlos "wird gespeichert".
  if (lauf.begonnen && !liste.some(o => o.key === lauf.key)) liste.push({ key: lauf.key, payload: payload() });
  if (!liste.length) return;
  status("info", "Sende …");
  let fehler = null;
  for (const o of liste) {
    try {
      await rpc("device_test_save", { p_key: o.key, p_payload: o.payload });
      LS.removeItem((o.pr || OFFEN) + o.key);
      if (o.key !== lauf.key) LS.removeItem("sj.gt.offen");
    } catch (e) { fehler = e; }
  }
  if (!fehler) status("ok", "Gespeichert als Lauf " + lauf.key.slice(0, 4));
  else status("err", "Nicht gespeichert: " + fehler.message, { grund: fehler.message === "keine Verbindung" ? "Gerade keine Verbindung" : "Der Server hat nicht angenommen (" + fehler.message + ")" });
}
// Hängt von früher noch etwas auf dem Gerät, gleich nachsenden
if (offene().length) kette = kette.then(allesSenden);

// Wake Lock gibt der Browser beim Wechsel in eine andere App frei; beim Zurückkommen neu holen wie die App
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && basis.wach.sperre && basis.wach.sperre.released && navigator.wakeLock && !Z.some(z => z.t.id === "bildschirm" && z.st === "laeuft"))
    navigator.wakeLock.request("screen").then(l => { basis.wach.sperre = l; }).catch(() => {});
});

function kopieren(k, zurueck) {
  const p = payload();
  const text = `Geräte-Test, Suite ${p.suite}, Lauf ${lauf.key.slice(0, 4)}\n${p.label}\n${p.ua}\n\n`
    + Z.map(z => `${z.t.titel}: ${z.erg ? z.erg.wert + " (" + z.erg.art + ")" : "nicht gelaufen"}`
      + (z.erg ? Object.keys(z.erg.mess || {}).map(k => `\n    ${k}: ${z.erg.mess[k]}`).join("") : "")).join("\n");
  const meld = s => { k.textContent = s; setTimeout(() => { k.textContent = zurueck; }, 2000); };
  (navigator.clipboard?.writeText ? navigator.clipboard.writeText(text) : Promise.reject()).then(
    () => meld("Kopiert"),
    // ohne Zwischenablage (In-App-Browser) bleibt der Teilen-Dialog als Ausweg
    () => navigator.share ? navigator.share({ text }).catch(() => {}) : meld("Kopieren ging nicht"));
}

for (const z of Z) z.feld = Object.assign(document.createElement("div"), { id: "feld" });
zeichne();
</script>
</body>
</html>
